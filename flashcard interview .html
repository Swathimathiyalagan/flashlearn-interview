<div class="question">

<h3>1. What is HTML?</h3>

<p>
HTML stands for HyperText Markup Language. It is the standard
markup language used to create and structure content on web pages.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
&lt;h1&gt;Welcome to My Website&lt;/h1&gt;
&lt;p&gt;This is my webpage.&lt;/p&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
HTML is the standard markup language used to create the structure
and content of web pages.
</div>

</div>


<div class="question">

<h3>2. What is HTML5?</h3>

<p>
HTML5 is the modern version of HTML. It provides semantic elements,
multimedia support, improved forms, canvas, SVG and web APIs.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
&lt;header&gt;My Website&lt;/header&gt;

&lt;video controls&gt;
    &lt;source src="video.mp4"&gt;
&lt;/video&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
HTML5 introduced modern features that make it easier to build
structured, multimedia and interactive web applications.
</div>

</div>


<div class="question">

<h3>3. What is the basic structure of HTML?</h3>

<p>
An HTML document normally contains DOCTYPE, html, head and body
elements. The head contains document information and the body
contains visible webpage content.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
&lt;!DOCTYPE html&gt;

&lt;html&gt;

&lt;head&gt;
    &lt;title&gt;My Website&lt;/title&gt;
&lt;/head&gt;

&lt;body&gt;
    &lt;h1&gt;Hello World&lt;/h1&gt;
&lt;/body&gt;

&lt;/html&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
The basic HTML structure consists of DOCTYPE, html, head and body
elements.
</div>

</div>


<div class="question">

<h3>4. Why is DOCTYPE used?</h3>

<p>
DOCTYPE tells the browser that the document should be interpreted
using the HTML standard and helps the browser use standards mode.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;body&gt;
    Hello World
&lt;/body&gt;
&lt;/html&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
DOCTYPE declares the document type and helps browsers render the
page using standards mode.
</div>

</div>


<div class="question">

<h3>5. What is the difference between HTML tag and element?</h3>

<p>
A tag is markup such as &lt;p&gt; or &lt;/p&gt;. An element generally
includes the opening tag, content and closing tag.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
&lt;p&gt;Hello World&lt;/p&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
A tag is the markup syntax, while an element is the complete
structure containing the tags and content.
</div>

</div>


<div class="question">

<h3>6. What are semantic HTML elements?</h3>

<p>
Semantic elements clearly describe the purpose of their content.
Examples include header, nav, main, section, article, aside and footer.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
&lt;header&gt;Header&lt;/header&gt;

&lt;nav&gt;Home | About&lt;/nav&gt;

&lt;main&gt;
    &lt;section&gt;
        Main Content
    &lt;/section&gt;
&lt;/main&gt;

&lt;footer&gt;Footer&lt;/footer&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Semantic HTML gives meaningful structure to webpages and improves
accessibility, readability and SEO.
</div>

</div>


<div class="question">

<h3>7. What is the difference between semantic and non-semantic elements?</h3>

<p>
Semantic elements describe their purpose, while non-semantic
elements are generic containers.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
&lt;article&gt;Blog Content&lt;/article&gt;

&lt;div&gt;Generic Container&lt;/div&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Elements like article and nav are semantic, while div and span
are generic non-semantic containers.
</div>

</div>


<div class="question">

<h3>8. What is the difference between div and section?</h3>

<p>
Div is a generic container used mainly for grouping content.
Section represents a meaningful thematic section of content.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
&lt;section&gt;
    &lt;h2&gt;About Us&lt;/h2&gt;
    &lt;p&gt;Company information&lt;/p&gt;
&lt;/section&gt;

&lt;div&gt;
    Generic content
&lt;/div&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Section has semantic meaning, whereas div is a generic container.
</div>

</div>


<div class="question">

<h3>9. What is the difference between div and span?</h3>

<p>
Div is normally used as a block-level container, while span is
an inline container used for smaller portions of content.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
&lt;div&gt;This is a block container&lt;/div&gt;

&lt;p&gt;
Hello &lt;span&gt;World&lt;/span&gt;
&lt;/p&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Div is commonly used for larger block sections, while span is
used for inline content.
</div>

</div>


<div class="question">

<h3>10. What is the purpose of the head element?</h3>

<p>
The head contains information about the document such as title,
metadata, stylesheets, favicon and scripts.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
&lt;head&gt;

&lt;title&gt;My Website&lt;/title&gt;

&lt;meta charset="UTF-8"&gt;

&lt;link rel="stylesheet" href="style.css"&gt;

&lt;/head&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
The head contains document metadata and external resources that
help configure the webpage.
</div>

</div>


<div class="question">

<h3>11. What is meta charset?</h3>

<p>
The charset meta tag specifies the character encoding used by
the HTML document. UTF-8 supports many languages and symbols.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
&lt;meta charset="UTF-8"&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
UTF-8 defines the character encoding and helps display text and
special characters correctly.
</div>

</div>


<div class="question">

<h3>12. What is the viewport meta tag?</h3>

<p>
The viewport meta tag controls how a webpage is displayed and
scaled on mobile devices.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
&lt;meta name="viewport"
content="width=device-width, initial-scale=1.0"&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
The viewport tag helps webpages display correctly on different
screen sizes, especially mobile devices.
</div>

</div>


<div class="question">

<h3>13. What are HTML attributes?</h3>

<p>
Attributes provide additional information or configuration to
HTML elements.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
&lt;img src="photo.jpg"
alt="Profile Photo"
width="200"&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
HTML attributes provide additional information about elements
and are written inside the opening tag.
</div>

</div>


<div class="question">

<h3>14. What is the difference between id and class?</h3>

<p>
The id attribute identifies a specific element, while class can
be shared by multiple elements.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
&lt;h1 id="title"&gt;Welcome&lt;/h1&gt;

&lt;p class="text"&gt;Hello&lt;/p&gt;
&lt;p class="text"&gt;Welcome&lt;/p&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
ID is normally unique within a document, while the same class
can be applied to multiple elements.
</div>

</div>


<div class="question">

<h3>15. What are global attributes?</h3>

<p>
Global attributes can generally be used on most HTML elements.
Examples include id, class, title, style, hidden and tabindex.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
&lt;p id="message"
class="text"
title="Information"&gt;
Hello World
&lt;/p&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Global attributes are common attributes that can be applied to
many different HTML elements.
</div>

</div>


<div class="question">

<h3>16. What are data-* attributes?</h3>

<p>
Data attributes allow developers to store custom data directly
inside HTML elements.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
&lt;button data-user-id="101"&gt;
View Profile
&lt;/button&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Data-* attributes store custom application data on HTML elements
and can be accessed using JavaScript.
</div>

</div>


<div class="question">

<h3>17. What is the anchor tag?</h3>

<p>
The anchor element is used to create hyperlinks between webpages,
sections, files and other resources.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
&lt;a href="about.html"&gt;
    About Us
&lt;/a&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
The anchor tag creates hyperlinks using the href attribute.
</div>

</div>


<div class="question">

<h3>18. What is the difference between absolute and relative URL?</h3>

<p>
An absolute URL contains the complete web address. A relative
URL points to a resource based on the current webpage location.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
&lt;a href="https://example.com"&gt;
Absolute URL
&lt;/a&gt;

&lt;a href="about.html"&gt;
Relative URL
&lt;/a&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Absolute URLs contain the complete address, while relative URLs
depend on the current document location.
</div>

</div>


<div class="question">

<h3>19. What is the target attribute?</h3>

<p>
The target attribute specifies where a linked resource should
open.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
&lt;a href="https://example.com"
target="_blank"&gt;
Open Website
&lt;/a&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
The target attribute controls the browsing context where a link
opens.
</div>

</div>


<div class="question">

<h3>20. What is the img element and why is alt important?</h3>

<p>
The img element displays images. The alt attribute provides
alternative text when an image cannot be displayed and improves
accessibility.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
&lt;img src="profile.jpg"
alt="Student Profile Photo"&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
The img element displays images and alt provides meaningful
alternative text for accessibility.
</div>

</div>


<div class="question">

<h3>21. What is the difference between strong and b?</h3>

<p>
Both can appear bold visually, but strong provides semantic
importance while b is mainly used for stylistic offset.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
&lt;strong&gt;Important Message&lt;/strong&gt;

&lt;b&gt;Bold Text&lt;/b&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Strong indicates importance, while b mainly represents text
that should be visually distinguished.
</div>

</div>


<div class="question">

<h3>22. What is the difference between em and i?</h3>

<p>
The em element represents emphasis, while i represents text in
an alternate voice or mood without necessarily indicating emphasis.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
&lt;em&gt;Very Important&lt;/em&gt;

&lt;i&gt;Technical Term&lt;/i&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Em has semantic emphasis, while i is generally used for text
that is stylistically or contextually different.
</div>

</div>


<div class="question">

<h3>23. What are ordered and unordered lists?</h3>

<p>
Ordered lists display items in a sequence, while unordered lists
display items without requiring a particular order.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
&lt;ol&gt;
    &lt;li&gt;HTML&lt;/li&gt;
    &lt;li&gt;CSS&lt;/li&gt;
&lt;/ol&gt;

&lt;ul&gt;
    &lt;li&gt;Python&lt;/li&gt;
    &lt;li&gt;JavaScript&lt;/li&gt;
&lt;/ul&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
OL is used for ordered or numbered items, while UL is used for
unordered or bullet items.
</div>

</div>


<div class="question">

<h3>24. What is the form element?</h3>

<p>
The form element is used to collect information from users.
It can contain inputs, labels, buttons, select boxes and textareas.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
&lt;form&gt;

&lt;label&gt;Name&lt;/label&gt;

&lt;input type="text"&gt;

&lt;button type="submit"&gt;
Submit
&lt;/button&gt;

&lt;/form&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
The form element groups controls used to collect and submit
user input.
</div>

</div>


<div class="question">

<h3>25. What are HTML5 input types?</h3>

<p>
HTML5 provides specialized input types that improve user
experience and built-in validation.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
&lt;input type="email"&gt;

&lt;input type="number"&gt;

&lt;input type="date"&gt;

&lt;input type="password"&gt;

&lt;input type="file"&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
HTML5 input types include email, number, date, time, url, tel,
search, color, range and file.
</div>

</div>


<div class="question">

<h3>26. What is the difference between GET and POST?</h3>

<p>
GET commonly sends form data as part of the URL and is suitable
for retrieving resources. POST sends data in the request body and
is commonly used when submitting data.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
&lt;form method="get"&gt;
    &lt;input name="search"&gt;
&lt;/form&gt;

&lt;form method="post"&gt;
    &lt;input name="username"&gt;
&lt;/form&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
GET is commonly used for retrieving data and can expose submitted
parameters in the URL. POST sends data in the request body and is
commonly used for submitting or changing data.
</div>

</div>


<div class="question">

<h3>27. What is the difference between required and readonly?</h3>

<p>
Required means the field must contain a value before successful
form submission. Readonly means the user cannot normally edit
the existing value.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
&lt;input type="text"
required&gt;

&lt;input type="text"
value="Swathi"
readonly&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Required controls whether a value is needed, while readonly
prevents normal editing of the field.
</div>

</div>


<div class="question">

<h3>28. What is the difference between disabled and readonly?</h3>

<p>
Disabled controls cannot normally be interacted with and are
excluded from form submission. Readonly controls cannot be edited
but their values can generally be submitted.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
&lt;input value="Disabled"
disabled&gt;

&lt;input value="Readonly"
readonly&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Disabled prevents interaction and submission, while readonly
allows the value to remain part of form submission.
</div>

</div>


<div class="question">

<h3>29. Why is the label element important?</h3>

<p>
The label describes a form control and improves usability and
accessibility. Clicking the label can also activate its associated
control.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
&lt;label for="email"&gt;
Email Address
&lt;/label&gt;

&lt;input id="email"
type="email"&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Labels make form controls easier to understand and improve
accessibility for users of assistive technologies.
</div>

</div>


<div class="question">

<h3>30. What is HTML form validation?</h3>

<p>
HTML provides built-in validation through attributes such as
required, minlength, maxlength, min, max, pattern and input types.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
&lt;input
type="email"
required&gt;

&lt;input
type="text"
minlength="5"
required&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
HTML form validation allows browsers to check common input
requirements before form submission.
</div>

</div>


<div class="question">

<h3>31. What is autocomplete?</h3>

<p>
The autocomplete attribute controls whether the browser may
suggest previously entered information for form fields.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
&lt;input
type="email"
autocomplete="email"&gt;

&lt;input
type="text"
autocomplete="name"&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Autocomplete helps browsers provide appropriate suggestions
for previously entered form information.
</div>

</div>


<div class="question">

<h3>32. What are audio and video elements?</h3>

<p>
HTML provides native audio and video elements for embedding
media without requiring external plugins.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
&lt;audio controls&gt;
    &lt;source src="song.mp3"&gt;
&lt;/audio&gt;

&lt;video controls width="400"&gt;
    &lt;source src="video.mp4"&gt;
&lt;/video&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Audio and video elements allow webpages to play multimedia
content natively.
</div>

</div>


<div class="question">

<h3>33. What is the difference between Canvas and SVG?</h3>

<p>
Canvas provides a drawing surface commonly controlled using
JavaScript. SVG uses vector elements that remain part of the
document structure.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
&lt;canvas id="myCanvas"
width="300"
height="150"&gt;
&lt;/canvas&gt;

&lt;svg width="200"
height="100"&gt;
    &lt;circle
    cx="50"
    cy="50"
    r="40"&gt;
    &lt;/circle&gt;
&lt;/svg&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Canvas is useful for dynamic pixel-based drawing, while SVG is
well suited for scalable vector graphics.
</div>

</div>


<div class="question">

<h3>34. What is iframe?</h3>

<p>
An iframe embeds another browsing context inside the current
webpage. It is often used for maps, videos and external content.
</p>

width="500"
height="300"&gt;
&lt;/iframe&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
An iframe allows another webpage or external browsing context
to be embedded inside the current webpage.
</div>

</div>


<div class="question">

<h3>35. What is the picture element?</h3>

The picture element allows developers to provide multiple image
sources so the browser can select an appropriate image.

&lt;source
media="(max-width:600px)"

&lt;img

alt="Website Banner"&gt;

&lt;/picture&gt;
</pre>

<div class="interview">
<strong>Interview Answer:</strong>
Picture allows responsive image sources to be selected based
on device or display conditions.
</div>

</div>


<div class="question">

<h3>36. What is srcset?</h3>

<p>
Srcset allows an image to provide multiple image resources with
different sizes or resolutions so the browser can select a suitable
one.

srcset="

image-800.jpg 800w,
image-1200.jpg 1200w"
alt="Nature"&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Srcset helps browsers select an appropriate image resource based
on display conditions and available image candidates.
</div>

</div>


<div class="question">

<h3>37. What is lazy loading?</h3>

<p>
Lazy loading delays loading certain resources until they are
closer to being needed. It can help reduce unnecessary initial
network and rendering work.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
&lt;img
src="large-image.jpg"
loading="lazy"
alt="Nature"&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Lazy loading loads resources closer to when they are needed,
which can improve initial page performance.
</div>

</div>


<div class="question">

<p>
Accessibility means designing webpages so that people with
different abilities can use them effectively, including users
who rely on assistive technologies.

<div class="interview">

text and keyboard-friendly controls to make webpages usable
by more people.
</div>

</div>

<p>
ARIA stands for Accessible Rich Internet Applications. It provides
additional accessibility information when native HTML semantics
are not sufficient.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
&lt;button
aria-label="Close menu"&gt;
X
&lt;/button&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
ARIA provides roles, states and properties that help assistive
technologies understand dynamic user interfaces.
</div>

</div>


<div class="question">

It helps browsers and assistive technologies interpret text correctly.
</p>

&lt;body&gt;
    &lt;h1&gt;Welcome&lt;/h1&gt;
&lt;/body&gt;

&lt;/html&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
The lang attribute specifies the language of a document or
specific element.
</div>

</div>


<div class="question">

<h3>41. How does HTML help SEO?</h3>

Proper HTML structure helps search engines understand the
content and hierarchy of a webpage.

Developer Portfolio
&lt;/article&gt;

<div class="interview">

links and useful metadata help search engines understand
webpage content.
</div>

</div>


<div class="question">

<h3>42. What is the difference between block and inline elements?</h3>

<p>
Block elements generally start on a new line and can occupy
available horizontal space. Inline elements flow within surrounding
content.
</p>

&lt;span&gt;Another Inline Element&lt;/span&gt;

Block elements normally start on a new line, while inline
elements normally remain within the same line of content.
</div>

</div>

closing tags.

&lt;hr&gt;

&lt;input type="text"&gt;

&lt;meta charset="UTF-8"&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Void elements are HTML elements that do not have closing tags,
such as img, input, br, hr, meta and link.
</div>

</div>


<div class="question">

<h3>44. What is the difference between localStorage and sessionStorage?</h3>

<p>

persists until the stored data is removed, while sessionStorage
is associated with the current browser session.
</p>

    "Swathi"
);

sessionStorage.setItem(
    "course",
    "HTML"
);
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>

is intended for data associated with the current browser session.
</div>

</div>


<div class="question">

<h3>45. What is the difference between cookies and localStorage?</h3>

<p>

localStorage is browser-side storage and is not automatically
included in HTTP requests.
</p>

<div class="example">

<pre>
document.cookie =
"username=Swathi";

localStorage.setItem(
"username",
"Swathi"
);
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Cookies are commonly used for session and server-related
purposes, while localStorage is mainly used for client-side
persistent data.
</div>

</div>


<div class="question">

JavaScript can later clone and insert its content into the page.
</p>

&lt;/div&gt;

&lt;/template&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
The template element stores reusable HTML content that can be
cloned and inserted dynamically using JavaScript.
</div>

</div>

HTML elements. They can use Custom Elements, Shadow DOM and
HTML templates.

);

</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Web Components allow developers to create reusable custom
HTML elements using browser-supported component standards.
</div>

</div>


<div class="question">

HTML uses the HTML syntax rules, while XHTML is HTML written
according to stricter XML syntax requirements.
</p>

<div class="example">

HTML:

&lt;input type="text"&gt;

XHTML-style:

&lt;input type="text" /&gt;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
XHTML applies stricter XML syntax rules, while modern HTML
has more flexible parsing rules.
</div>

</div>

the presentation, layout, colors, fonts, spacing and responsive
behavior of HTML elements.
</p>

<div class="question">

<p>
CSS can be applied using inline CSS, internal CSS and external
CSS. External CSS is commonly preferred for maintainability
and reuse.
</p>

<div class="example">

&lt;style&gt;

&lt;link rel="stylesheet"

</pre>
</div>

<div class="interview">

The three ways are inline, internal and external CSS. External
CSS is generally preferred for larger projects.
</div>

</div>


<div class="question">

<h3>3. What is a CSS selector?</h3>

<p>
A selector identifies the HTML elements to which CSS rules
should be applied.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
p {
    color: red;
}

.title {
    color: blue;
}

#header {
    background: black;
}
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
A CSS selector targets HTML elements so that styles can be
applied to them.
</div>

</div>


<div class="question">

<h3>4. What is the difference between class and ID selector?</h3>

<p>
A class selector can be reused on multiple elements, while an
ID selector is intended to identify a specific element uniquely.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
.title {
    color: blue;
}

#main {
    color: red;
}
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Class selectors are reusable, while ID selectors are normally
used for a unique element.
</div>

</div>


<div class="question">

<h3>5. What is CSS specificity?</h3>

<p>
Specificity determines which CSS rule has higher priority when
multiple rules target the same element.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
p {
    color: blue;
}

.text {
    color: green;
}

#message {
    color: red;
}
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
CSS specificity is the system browsers use to determine which
conflicting CSS declaration should be applied.
</div>

</div>


<div class="question">

<h3>6. What is the CSS cascade?</h3>

<p>
The cascade is the process used by the browser to decide which
CSS declarations apply when multiple rules match an element.
</p>

<div class="example">
<strong>Code Example:</strong>
<pre>
p {
    color: blue;
}

p {
    color: red;
}
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
The CSS cascade resolves conflicting styles based on factors
such as origin, importance, specificity and source order.
</div>

</div>

using content, padding, border and margin.
</p>

    padding: 20px;
    border: 2px solid black;
    margin: 15px;
}

</div>

It determines the space occupied by an element.

</div>

an element are calculated.
</p>

}

.card {

    padding: 20px;
    border: 2px solid black;
}
</pre>
</div>

content, padding and border.
</div>

</div>


<div class="question">

Margin creates space outside an element, while padding creates
space between the content and the element's border.
</p>

<div class="example">

<pre>
.card {
    margin: 20px;
    padding: 20px;
}
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Margin controls outer spacing, while padding controls inner
spacing.
</div>

</div>

along the main axis.

along the main axis.

    for i in range(100000):

Python bytecode by multiple threads, so threads are generally
better suited to I/O-bound workloads than CPU-bound workloads.

</div>


<div class="question">

<h3>2. What is a database?</h3>

<p>
A database is an organized collection of data that can be
stored, accessed, updated and managed efficiently.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
CREATE DATABASE student_db;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
A database is a structured collection of data that allows
applications to efficiently store and retrieve information.
</div>

</div>


<div class="question">

<h3>3. What is DBMS?</h3>

<p>
DBMS stands for Database Management System. It is software used
to create, store, update and manage databases.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
CREATE DATABASE company_db;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
A DBMS is software that provides tools to create, manage and
access databases.
</div>

</div>


<div class="question">

<h3>4. What is RDBMS?</h3>

<p>
RDBMS stands for Relational Database Management System. It stores
data in tables consisting of rows and columns and supports
relationships between tables.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
CREATE TABLE students (
    id INT,
    name VARCHAR(100)
);
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
RDBMS stores data in related tables and uses keys and constraints
to maintain relationships and data integrity.
</div>

</div>


<div class="question">

<h3>5. What is SQL?</h3>

<p>
SQL stands for Structured Query Language. It is used to
communicate with relational databases.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
SELECT *
FROM students;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
SQL is the language used to create, query, modify and manage
data in relational database systems.
</div>

</div>


<div class="question">

<h3>6. What is a table?</h3>

<p>
A table is a database structure that stores data in rows and
columns.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
CREATE TABLE employees (
    id INT,
    name VARCHAR(100),
    salary DECIMAL(10,2)
);
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
A table stores related data in rows and columns inside a
relational database.
</div>

</div>


<div class="question">

<h3>7. What is a primary key?</h3>

<p>
A primary key uniquely identifies each row in a table.
It cannot contain NULL values.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
CREATE TABLE students (
    id INT PRIMARY KEY,
    name VARCHAR(100)
);
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
A primary key uniquely identifies each record in a table and
does not allow NULL values.
</div>

</div>


<div class="question">

<h3>8. What is a foreign key?</h3>

<p>
A foreign key is a column or set of columns that references
a key in another table and helps maintain referential integrity.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
CREATE TABLE orders (
    order_id INT PRIMARY KEY,
    customer_id INT,
    FOREIGN KEY (customer_id)
    REFERENCES customers(id)
);
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
A foreign key creates a relationship between tables by
referencing a key in another table.
</div>

</div>


<div class="question">

<h3>9. What is a UNIQUE constraint?</h3>

<p>
The UNIQUE constraint ensures that values in a column or column
combination are not duplicated.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
CREATE TABLE users (
    id INT PRIMARY KEY,
    email VARCHAR(150) UNIQUE
);
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
UNIQUE prevents duplicate values in the constrained column or
column combination.
</div>

</div>


<div class="question">

<h3>10. What is NOT NULL?</h3>

<p>
NOT NULL ensures that a column must contain a value.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
CREATE TABLE students (
    id INT PRIMARY KEY,
    name VARCHAR(100) NOT NULL
);
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
NOT NULL prevents a column from storing NULL values.
</div>

</div>


<div class="question">

<h3>11. What is DEFAULT constraint?</h3>

<p>
DEFAULT provides a value automatically when no value is supplied
for a column during insertion.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
CREATE TABLE users (
    id INT,
    status VARCHAR(20)
    DEFAULT 'Active'
);
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
DEFAULT automatically assigns a specified value when an insert
does not provide a value for that column.
</div>

</div>


<div class="question">

<h3>12. What is AUTO_INCREMENT?</h3>

<p>
AUTO_INCREMENT automatically generates sequential numeric values,
commonly for primary key columns.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
CREATE TABLE students (
    id INT PRIMARY KEY
    AUTO_INCREMENT,
    name VARCHAR(100)
);
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
AUTO_INCREMENT automatically generates a new numeric value for
a column when a row is inserted.
</div>

</div>


<div class="question">

<h3>13. What is the difference between DELETE, TRUNCATE and DROP?</h3>

<p>
DELETE removes selected rows, TRUNCATE removes all rows from a
table, and DROP removes the table itself.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
DELETE FROM students
WHERE id = 5;

TRUNCATE TABLE students;

DROP TABLE students;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
DELETE removes rows and supports filtering, TRUNCATE removes
all rows, while DROP removes the table definition and data.
</div>

</div>


<div class="question">

<h3>14. What is INSERT?</h3>

<p>
INSERT is used to add new records to a table.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
INSERT INTO students
(name, age)
VALUES
('Swathi', 22);
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
INSERT adds one or more new rows to a database table.
</div>

</div>


<div class="question">

<h3>15. What is SELECT?</h3>

<p>
SELECT is used to retrieve data from one or more tables.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
SELECT name, age
FROM students;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
SELECT retrieves required columns or records from database tables.
</div>

</div>


<div class="question">

<h3>16. What is UPDATE?</h3>

<p>
UPDATE modifies existing records in a table.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
UPDATE students
SET age = 23
WHERE id = 1;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
UPDATE modifies existing rows based on a specified condition.
</div>

</div>


<div class="question">

<h3>17. What is WHERE clause?</h3>

<p>
WHERE filters rows based on a specified condition.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
SELECT *
FROM students
WHERE age > 20;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
WHERE is used to filter records that satisfy a condition.
</div>

</div>


<div class="question">

<h3>18. What is ORDER BY?</h3>

<p>
ORDER BY sorts query results in ascending or descending order.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
SELECT *
FROM students
ORDER BY age DESC;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
ORDER BY sorts the result set using one or more columns.
</div>

</div>


<div class="question">

<h3>19. What is GROUP BY?</h3>

<p>
GROUP BY groups rows with the same values so aggregate
calculations can be performed for each group.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
SELECT department,
       COUNT(*) AS total
FROM employees
GROUP BY department;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
GROUP BY groups records based on one or more columns and is
commonly used with aggregate functions.
</div>

</div>


<div class="question">

<h3>20. What is HAVING?</h3>

<p>
HAVING filters groups after GROUP BY is applied.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
SELECT department,
       COUNT(*) AS total
FROM employees
GROUP BY department
HAVING COUNT(*) > 5;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
HAVING filters grouped results, while WHERE filters individual
rows before grouping.
</div>

</div>


<div class="question">

<h3>21. What is DISTINCT?</h3>

<p>
DISTINCT removes duplicate values from the query result.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
SELECT DISTINCT department
FROM employees;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
DISTINCT returns only unique combinations of the selected columns.
</div>

</div>


<div class="question">

<h3>22. What is LIKE operator?</h3>

<p>
LIKE is used for pattern matching in string values.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
SELECT *
FROM students
WHERE name LIKE 'S%';
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
LIKE is used to search text using patterns. % represents
zero or more characters and _ represents one character.
</div>

</div>


<div class="question">

<h3>23. What is the IN operator?</h3>

<p>
IN checks whether a value matches any value in a specified list
or subquery result.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
SELECT *
FROM students
WHERE city IN
('Chennai', 'Madurai');
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
IN provides a concise way to compare a value against multiple
possible values.
</div>

</div>


<div class="question">

<h3>24. What is BETWEEN?</h3>

<p>
BETWEEN checks whether a value falls within an inclusive range.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
SELECT *
FROM employees
WHERE salary
BETWEEN 20000 AND 50000;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
BETWEEN is used to filter values within a range, including
the boundary values.
</div>

</div>


<div class="question">

<h3>25. What is NULL?</h3>

<p>
NULL represents the absence of a value. It is different from
zero, an empty string or false.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
SELECT *
FROM students
WHERE phone IS NULL;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
NULL represents missing or unknown data and should be checked
using IS NULL or IS NOT NULL.
</div>

</div>


<div class="question">

<h3>26. What are aggregate functions?</h3>

<p>
Aggregate functions perform calculations over multiple rows.
Common examples are COUNT, SUM, AVG, MIN and MAX.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
SELECT
COUNT(*) AS total,
SUM(salary) AS total_salary,
AVG(salary) AS average_salary,
MAX(salary) AS highest_salary,
MIN(salary) AS lowest_salary
FROM employees;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Aggregate functions calculate summary values from multiple rows.
</div>

</div>


<div class="question">

<h3>27. What is COUNT()?</h3>

<p>
COUNT() returns the number of rows or non-NULL values depending
on the expression used.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
SELECT COUNT(*) AS total_students
FROM students;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
COUNT() is used to count rows or non-NULL values.
COUNT(*) counts rows, including rows containing NULLs in
individual columns.
</div>

</div>


<div class="question">

<h3>28. What is SUM()?</h3>

<p>
SUM() calculates the total of numeric values.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
SELECT SUM(salary)
AS total_salary
FROM employees;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
SUM() returns the total of non-NULL numeric values.
</div>

</div>


<div class="question">

<h3>29. What is AVG()?</h3>

<p>
AVG() calculates the average of numeric values.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
SELECT AVG(salary)
AS average_salary
FROM employees;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
AVG() returns the arithmetic mean of non-NULL numeric values.
</div>

</div>


<div class="question">

<h3>30. What is a JOIN?</h3>

<p>
A JOIN combines related rows from two or more tables based on
a matching condition.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
SELECT
students.name,
courses.course_name
FROM students
JOIN courses
ON students.course_id =
   courses.id;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
JOINs are used to retrieve related data from multiple tables.
</div>

</div>


<div class="question">

<h3>31. What is INNER JOIN?</h3>

<p>
INNER JOIN returns rows where the join condition matches in
both tables.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
SELECT
s.name,
c.course_name
FROM students s
INNER JOIN courses c
ON s.course_id = c.id;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
INNER JOIN returns only matching records from both tables.
</div>

</div>


<div class="question">

<h3>32. What is LEFT JOIN?</h3>

<p>
LEFT JOIN returns all rows from the left table and matching
rows from the right table. Non-matching right-side values
become NULL.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
SELECT
s.name,
c.course_name
FROM students s
LEFT JOIN courses c
ON s.course_id = c.id;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
LEFT JOIN keeps every row from the left table and adds matching
data from the right table when available.
</div>

</div>


<div class="question">

<h3>33. What is RIGHT JOIN?</h3>

<p>
RIGHT JOIN returns all rows from the right table and matching
rows from the left table.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
SELECT
s.name,
c.course_name
FROM students s
RIGHT JOIN courses c
ON s.course_id = c.id;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
RIGHT JOIN keeps every row from the right table and includes
matching rows from the left table.
</div>

</div>


<div class="question">

<h3>34. What is a SELF JOIN?</h3>

<p>
A SELF JOIN joins a table with itself. It is useful for
hierarchical relationships such as employees and managers.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
SELECT
e.name AS employee,
m.name AS manager
FROM employees e
LEFT JOIN employees m
ON e.manager_id = m.id;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
A self join uses aliases to join a table with itself.
</div>

</div>


<div class="question">

<h3>35. What is a subquery?</h3>

<p>
A subquery is a query nested inside another SQL query.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
SELECT name
FROM employees
WHERE salary >
(
    SELECT AVG(salary)
    FROM employees
);
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
A subquery is an inner query whose result is used by an
outer query.
</div>

</div>


<div class="question">

<h3>36. What is a correlated subquery?</h3>

<p>
A correlated subquery depends on values from the outer query
and is logically evaluated for each relevant outer row.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
SELECT e1.name,
       e1.salary
FROM employees e1
WHERE e1.salary >
(
    SELECT AVG(e2.salary)
    FROM employees e2
    WHERE e2.department =
          e1.department
);
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
A correlated subquery references columns from the outer query
and depends on each outer row.
</div>

</div>


<div class="question">

<h3>37. What is a view?</h3>

<p>
A view is a stored SQL query that can be queried like a table.
It generally stores the query definition rather than a separate
copy of the underlying data.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
CREATE VIEW employee_view AS
SELECT name, salary
FROM employees
WHERE salary > 30000;

SELECT *
FROM employee_view;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
A view is a virtual table based on a stored query and can
simplify complex queries and control data access.
</div>

</div>


<div class="question">

<h3>38. What is an index?</h3>

<p>
An index is a data structure that can improve the speed of
searching and retrieving rows, at the cost of additional storage
and write overhead.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
CREATE INDEX idx_email
ON users(email);
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
An index improves query performance for suitable access patterns,
but indexes also require storage and can slow INSERT, UPDATE
and DELETE operations.
</div>

</div>


<div class="question">

<h3>39. What is normalization?</h3>

<p>
Normalization is the process of organizing relational data to
reduce unnecessary duplication and improve data integrity.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
CREATE TABLE departments (
    id INT PRIMARY KEY,
    name VARCHAR(100)
);

CREATE TABLE employees (
    id INT PRIMARY KEY,
    name VARCHAR(100),
    department_id INT,
    FOREIGN KEY
    (department_id)
    REFERENCES departments(id)
);
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Normalization structures data into related tables to reduce
redundancy and improve consistency.
</div>

</div>


<div class="question">

<h3>40. What is denormalization?</h3>

<p>
Denormalization intentionally introduces some redundancy to
reduce joins and potentially improve read performance for
specific workloads.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
SELECT
e.name,
d.name AS department
FROM employees e
JOIN departments d
ON e.department_id = d.id;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Denormalization adds controlled redundancy when it provides
performance or reporting benefits.
</div>

</div>


<div class="question">

<h3>41. What is a transaction?</h3>

<p>
A transaction is a sequence of database operations treated as
a single logical unit of work.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
START TRANSACTION;

UPDATE accounts
SET balance = balance - 100
WHERE id = 1;

UPDATE accounts
SET balance = balance + 100
WHERE id = 2;

COMMIT;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
A transaction groups related database operations so they can
be committed together or rolled back when necessary.
</div>

</div>


<div class="question">

<h3>42. What are ACID properties?</h3>

<p>
ACID stands for Atomicity, Consistency, Isolation and Durability.
These properties help ensure reliable transaction processing.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
START TRANSACTION;

UPDATE accounts
SET balance = balance - 500
WHERE id = 1;

UPDATE accounts
SET balance = balance + 500
WHERE id = 2;

COMMIT;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Atomicity means all-or-nothing, Consistency preserves valid
database rules, Isolation controls concurrent transactions,
and Durability preserves committed changes.
</div>

</div>


<div class="question">

<h3>43. What is COMMIT?</h3>

<p>
COMMIT permanently applies the changes made by the current
transaction.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
START TRANSACTION;

UPDATE employees
SET salary = salary + 2000
WHERE id = 1;

COMMIT;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
COMMIT makes the changes of a transaction permanent.
</div>

</div>


<div class="question">

<h3>44. What is ROLLBACK?</h3>

<p>
ROLLBACK cancels changes made during the current transaction
that have not been committed.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
START TRANSACTION;

DELETE FROM employees
WHERE id = 5;

ROLLBACK;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
ROLLBACK undoes uncommitted changes made during a transaction.
</div>

</div>


<div class="question">

<h3>45. What is a stored procedure?</h3>

<p>
A stored procedure is a named collection of SQL statements
stored in the database and executed using CALL.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
DELIMITER //

CREATE PROCEDURE
GetEmployees()
BEGIN

    SELECT *
    FROM employees;

END //

DELIMITER ;

CALL GetEmployees();
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
A stored procedure is reusable SQL logic stored in the database
and executed when needed.
</div>

</div>


<div class="question">

<h3>46. What is a trigger?</h3>

<p>
A trigger is a database object that automatically executes
when specified events occur on a table, such as INSERT, UPDATE
or DELETE.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
CREATE TRIGGER
before_employee_insert
BEFORE INSERT ON employees
FOR EACH ROW
SET NEW.created_at =
    CURRENT_TIMESTAMP;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
A trigger automatically executes predefined SQL logic when
specified table events occur.
</div>

</div>


<div class="question">

<h3>47. What is a constraint?</h3>

<p>
Constraints are rules applied to table columns to maintain
data integrity and valid relationships.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
CREATE TABLE users (

    id INT PRIMARY KEY,

    email VARCHAR(100)
    UNIQUE,

    name VARCHAR(100)
    NOT NULL,

    age INT
    CHECK (age >= 18)

);
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Constraints enforce rules such as uniqueness, required values,
valid ranges and relationships between tables.
</div>

</div>


<div class="question">

<h3>48. What is the difference between WHERE and HAVING?</h3>

<p>
WHERE filters individual rows before grouping, while HAVING
filters grouped results after GROUP BY.
</p>

<div class="example">
<strong>SQL Example:</strong>
<pre>
SELECT department,
       COUNT(*) AS total
FROM employees
WHERE salary > 20000
GROUP BY department
HAVING COUNT(*) > 3;
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
WHERE filters rows before grouping, whereas HAVING filters
groups after aggregation.
</div>

</div>


<div class="question">

<h3>49. What is the difference between CHAR and VARCHAR?</h3>

<p>

from data and use those patterns to make predictions or decisions.

Machine Learning Model

Prediction

Image

Neural Network

Feature Extraction

Prediction

complex patterns from large amounts of data.

Prompt
  ↓
Generative AI Model

Generated Text / Image / Code

<p>

from data and uses them to perform predictions, classifications
or generation tasks.

<pre>
Training Data
      ↓
AI Model
      ↓
Prediction

produce predictions, classifications or generated outputs.

</div>

<p>

how to identify patterns and relationships.

<pre>
Images + Labels
      ↓
Training
      ↓
Image Classifier
</pre>
</div>

<strong>Interview Answer:</strong>
Training data is the dataset used by a machine learning algorithm
to learn patterns and parameters.
</div>

</div>


<div class="question">

<p>
Supervised learning trains a model using labeled input-output
examples.
</p>

<div class="example">
<strong>Example:</strong>
<pre>
Input        Label
------------------
Email        Spam
Email        Not Spam
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Supervised learning learns from labeled data to predict outputs
for new inputs.
</div>

</div>

<p>
Unsupervised learning finds patterns or structures in data without
using labeled target outputs.

<pre>
Customer Data
     ↓
Clustering
     ↓
Customer Groups
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Unsupervised learning identifies hidden patterns or groups in
unlabeled data.
</div>

</div>


<div class="question">

Reinforcement learning trains an agent through interaction with
an environment using rewards and penalties.

<pre>
Agent
  ↓
Action
  ↓
Environment
  ↓
Reward
</pre>

<div class="interview">
<strong>Interview Answer:</strong>
Reinforcement learning learns an optimal behavior by receiving
rewards or penalties for actions.
</div>

</div>


<div class="question">

<pre>
Email
 ↓
Classifier
 ↓
Spam / Not Spam
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Classification predicts categorical labels such as spam or
not spam.
</div>

</div>


<div class="question">

Regression predicts a continuous numerical value.
</p>

House Features
      ↓
Regression Model
      ↓
Predicted Price
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Regression is used when the target output is a continuous
numeric value such as price or temperature.
</div>

</div>


<div class="question">

<p>
Clustering is an unsupervised learning technique that groups
similar data points together.
</p>

<div class="example">
<strong>Example:</strong>
<pre>
Customer Data
     ↓
K-Means
     ↓
Customer Groups
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Clustering groups similar data points without predefined labels.
</div>

</div>


<div class="question">

<p>
A neural network is a machine learning model inspired by the
structure of biological neural networks.
</p>

<div class="example">
<strong>Example:</strong>
<pre>
Input Layer
     ↓
Hidden Layers
     ↓
Output Layer
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
A neural network consists of interconnected computational units
called neurons that learn patterns from data.
</div>

</div>

<h3>14. What is a neuron?</h3>

<p>
A neuron is a computational unit in a neural network that receives
inputs, applies weights and bias, and produces an output through
an activation function.
</p>

<div class="example">
<strong>Example:</strong>
<pre>
Inputs
  ↓
Weights + Bias
  ↓
Activation Function
  ↓
Output
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
A neuron processes input values using weights, bias and an
activation function to produce an output.
</div>

</div>


<div class="question">

<h3>15. What is an activation function?</h3>

<p>
An activation function introduces non-linearity into neural
networks and determines the output of a neuron.
</p>

<div class="example">
<strong>Examples:</strong>
<pre>
ReLU
Sigmoid
Tanh
Softmax
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Activation functions introduce non-linear behavior so neural
networks can learn complex relationships.
</div>

</div>


<div class="question">

<p>
ReLU stands for Rectified Linear Unit. It returns zero for
negative inputs and the input itself for positive values.
</p>

<div class="example">
<strong>Example:</strong>
<pre>
ReLU(x) = max(0, x)

ReLU(-5) = 0
ReLU(5)  = 5
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
ReLU is a common activation function that outputs zero for
negative values and the input value for positive values.
</div>

</div>


<div class="question">

<p>
An epoch represents one complete pass through the entire training
dataset during model training.
</p>

<div class="example">
<strong>Example:</strong>
<pre>
Dataset
   ↓
Epoch 1
   ↓
Epoch 2
   ↓
Epoch 3
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
One epoch means the model has processed the complete training
dataset once.
</div>

</div>


<div class="question">

<h3>18. What is batch size?</h3>

<p>
Batch size is the number of training samples processed before
the model updates its parameters.
</p>

<div class="example">
<strong>Example:</strong>
<pre>
Dataset = 1000 samples
Batch Size = 32

Model processes
32 samples at a time.
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Batch size determines how many training samples are processed
before each parameter update.
</div>

</div>


<div class="question">

<h3>19. What is overfitting?</h3>

<p>
Overfitting occurs when a model learns the training data too
closely, including noise, and performs poorly on unseen data.
</p>

<div class="example">
<strong>Example:</strong>
<pre>
Training Accuracy = 99%
Testing Accuracy  = 70%
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Overfitting happens when a model performs very well on training
data but fails to generalize to new data.
</div>

</div>


<div class="question">

<h3>20. What is underfitting?</h3>

<p>
Underfitting occurs when a model is too simple to capture the
important patterns in the data.
</p>

<div class="example">
<strong>Example:</strong>
<pre>
Training Accuracy = 60%
Testing Accuracy  = 58%
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Underfitting occurs when a model cannot learn enough from the
training data and performs poorly on both training and unseen data.
</div>

</div>


<div class="question">

<p>
Train-test split divides a dataset into training data and testing
data to evaluate model generalization.
</p>

<pre>

)

<strong>Interview Answer:</strong>
Train-test split separates data used for learning from data used
for evaluating model performance.
</div>

</div>


<div class="question">

<h3>22. What is validation data?</h3>

<p>
Validation data is used during model development to tune
hyperparameters and compare model configurations.
</p>

<div class="example">
<strong>Example:</strong>
<pre>
Training Data
     ↓
Model Training
     ↓
Validation Data
     ↓
Parameter Tuning
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Validation data helps select and tune model configurations
without using the final test set.
</div>

</div>


<div class="question">

<h3>23. What is accuracy?</h3>

<p>
Accuracy is the proportion of correct predictions among all
predictions.
</p>

<div class="example">
<strong>Formula:</strong>
<pre>
Accuracy =
Correct Predictions
-------------------
Total Predictions
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Accuracy measures the percentage of predictions that are correct,
but it may not be suitable for highly imbalanced datasets.
</div>

</div>


<div class="question">

<h3>24. What is precision?</h3>

<p>
Precision measures how many of the instances predicted as
positive are actually positive.
</p>

<div class="example">
<strong>Formula:</strong>
<pre>
Precision =
TP
---------
TP + FP
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Precision is important when false positive predictions are costly.
</div>

</div>


<div class="question">

<h3>25. What is recall?</h3>

<p>
Recall measures how many actual positive instances were correctly
identified by the model.
</p>

<div class="example">
<strong>Formula:</strong>
<pre>
Recall =
TP
---------
TP + FN
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Recall is important when missing a positive case is costly.
</div>

</div>


<div class="question">

<h3>26. What is F1-score?</h3>

<p>
F1-score is the harmonic mean of precision and recall.
</p>

<div class="example">
<strong>Formula:</strong>
<pre>
F1 =
2 × Precision × Recall
----------------------
Precision + Recall
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
F1-score balances precision and recall and is useful when both
false positives and false negatives matter.
</div>

</div>


<div class="question">

<h3>27. What is a confusion matrix?</h3>

<p>
A confusion matrix summarizes classification predictions using
True Positive, True Negative, False Positive and False Negative.
</p>

<div class="example">
<strong>Example:</strong>
<pre>
                Predicted
              Yes      No

Actual Yes     TP       FN
Actual No      FP       TN
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
A confusion matrix shows the detailed distribution of correct
and incorrect classification predictions.
</div>

</div>


<div class="question">

<h3>28. What is feature engineering?</h3>

<p>
Feature engineering is the process of creating, transforming or
selecting useful input features for a machine learning model.
</p>

<div class="example">
<strong>Example:</strong>
<pre>
Date of Birth
     ↓
Age

First Name + Last Name
     ↓
Full Name
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Feature engineering creates or transforms input variables to
help a machine learning model learn useful patterns.
</div>

</div>


<div class="question">

<h3>29. What is feature scaling?</h3>

<p>
Feature scaling transforms numerical features to comparable
scales so algorithms are not dominated by large-valued features.
</p>

<div class="example">

<div class="interview">
<strong>Interview Answer:</strong>

and is especially important for distance-based and gradient-based
algorithms.

</div>


<div class="question">

<p>
Normalization commonly scales numeric values to a fixed range,
often 0 to 1.
</p>

<div class="example">
<strong>Formula:</strong>
<pre>
x' =
(x - min)
---------
(max - min)
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Normalization rescales numeric features to a common range,
often between zero and one.
</div>

</div>


<div class="question">

<p>
A hyperparameter is a configuration value set before or during
model training rather than learned directly from the training data.

<div class="example">

<pre>
Learning Rate
Number of Trees
Maximum Depth
Batch Size
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Hyperparameters control the learning process and are chosen or
tuned outside the model's learned parameters.
</div>

</div>


<div class="question">

<h3>32. What is learning rate?</h3>

<p>
Learning rate controls the size of parameter updates during
optimization.
</p>

<div class="example">
<strong>Example:</strong>
<pre>
Learning Rate = 0.001

Small updates
during training
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Learning rate determines how much model parameters are adjusted
during each optimization step.
</div>

</div>


<div class="question">

<h3>33. What is gradient descent?</h3>

<p>
Gradient descent is an optimization algorithm that updates model
parameters to minimize a loss function.
</p>

<div class="example">

<pre>
Calculate Loss
      ↓
Calculate Gradient
      ↓
Update Parameters
      ↓
Repeat
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Gradient descent iteratively adjusts model parameters in the
direction that reduces the loss function.
</div>

</div>

<p>

are from the actual target values.
</p>

<div class="example">
<strong>Examples:</strong>
<pre>
Mean Squared Error
Cross Entropy Loss
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
A loss function quantifies prediction error and provides a
signal for optimizing model parameters.
</div>

</div>


<div class="question">

<h3>35. What is NLP?</h3>

<p>
NLP stands for Natural Language Processing. It enables computers
to process, understand and generate human language.
</p>

<div class="example">
<strong>Examples:</strong>
<pre>
Chatbots
Translation
Sentiment Analysis
Text Summarization
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
NLP is a field of AI that focuses on processing and understanding
human language.
</div>

</div>


<div class="question">

<h3>36. What is Computer Vision?</h3>

<p>
Computer Vision enables computers to interpret and understand
information from images and videos.
</p>

<div class="example">
<strong>Examples:</strong>
<pre>
Image Classification
Object Detection
Face Recognition
OCR
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Computer Vision is an AI field that allows machines to analyze
and understand visual information.
</div>

</div>


<div class="question">

<h3>37. What is a Large Language Model?</h3>

<p>
A Large Language Model (LLM) is a neural network trained on large
amounts of text to understand and generate language.
</p>

<div class="example">
<strong>Process:</strong>
<pre>
User Prompt
     ↓
LLM
     ↓
Generated Response
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
An LLM is a large neural language model trained on extensive
text data to perform language understanding and generation tasks.
</div>

</div>


<div class="question">

<h3>38. What is a prompt?</h3>

<p>
A prompt is the instruction or input provided to an AI model
to produce a desired output.
</p>

<div class="example">
<strong>Example:</strong>
<pre>
Prompt:

"Explain Python
in simple terms."
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
A prompt is the input or instruction given to a generative AI
model to guide its response.
</div>

</div>


<div class="question">

<h3>39. What is prompt engineering?</h3>

<p>
Prompt engineering is the process of designing clear and
effective prompts to guide AI models toward useful outputs.
</p>

<div class="example">
<strong>Example:</strong>
<pre>
Role:
You are a Python teacher.

Task:
Explain loops for beginners.

Format:
Give 3 examples.
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Prompt engineering involves designing effective instructions
that improve the relevance, structure and reliability of AI
model outputs.
</div>

</div>


<div class="question">

<h3>40. What is a chatbot?</h3>

<p>
A chatbot is an application that communicates with users using
text or voice, often using NLP or generative AI.
</p>

<div class="example">
<strong>Process:</strong>
<pre>
User Message
     ↓
Chatbot
     ↓
AI Model
     ↓
Response
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
A chatbot is a software application that interacts with users
through natural language.
</div>

</div>


<div class="question">

<h3>41. What is an embedding?</h3>

<p>
An embedding is a numerical vector representation of data such
as text, images or audio that captures useful semantic or
contextual relationships.
</p>

<div class="example">
<strong>Example:</strong>
<pre>
"Python Developer"
        ↓
Embedding Model
        ↓
[0.12, -0.45, 0.87, ...]
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
An embedding converts information into numerical vectors so
similar meanings can be compared mathematically.
</div>

</div>


<div class="question">

<h3>42. What is a vector database?</h3>

<p>
A vector database stores and searches high-dimensional vectors,
often used for semantic search and retrieval-augmented applications.
</p>

<div class="example">
<strong>Process:</strong>
<pre>
Document
   ↓
Embedding
   ↓
Vector Database
   ↓
Similarity Search
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
A vector database is optimized for storing embeddings and
performing similarity searches.
</div>

</div>


<div class="question">

<h3>43. What is RAG?</h3>

<p>
RAG stands for Retrieval-Augmented Generation. It retrieves
relevant information from an external knowledge source and
provides it to a generative model before generating a response.
</p>

<div class="example">
<strong>Process:</strong>
<pre>
User Question
     ↓
Retrieve Relevant Data
     ↓
AI Model
     ↓
Answer
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
RAG combines information retrieval with generation so an AI
model can answer using relevant external or private data.
</div>

</div>


<div class="question">

<h3>44. What is hallucination in Generative AI?</h3>

<p>
Hallucination occurs when an AI model generates information that
sounds plausible but is incorrect, unsupported or fabricated.
</p>

<div class="example">
<strong>Example:</strong>
<pre>
Question
   ↓
AI Model
   ↓
Confident but Incorrect Answer
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
AI hallucination is when a model produces inaccurate or
unsupported information as if it were factual.
</div>

</div>


<div class="question">

<h3>45. What is fine-tuning?</h3>

<p>
Fine-tuning adapts a pretrained model by training it further
on a task-specific or domain-specific dataset.
</p>

<div class="example">
<strong>Process:</strong>
<pre>
Pretrained Model
       ↓
Domain Dataset
       ↓
Fine-Tuning
       ↓
Specialized Model
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Fine-tuning further trains a pretrained model on specialized
data to improve performance for a particular task or domain.
</div>

</div>


<div class="question">

<h3>46. What is transfer learning?</h3>

<p>
Transfer learning uses knowledge learned from one task or dataset
as a starting point for another related task.
</p>

<div class="example">
<strong>Process:</strong>
<pre>
Pretrained Model
      ↓
New Dataset
      ↓
New Task
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Transfer learning reuses knowledge from a pretrained model
to solve a related task more efficiently.
</div>

</div>


<div class="question">

<h3>47. What is an API in AI applications?</h3>

<p>
An AI API allows an application to communicate with an AI service
or model through defined programmatic requests.
</p>

<div class="example">
<strong>Python Example:</strong>
<pre>
import requests

response = requests.post(
    "https://api.example.com/generate",
    json={
        "prompt": "Explain Python"
    }
)

print(response.json())
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
An AI API allows software applications to send inputs to an
AI service and receive model-generated outputs programmatically.
</div>

</div>


<div class="question">

<h3>48. What is AI model evaluation?</h3>

<p>
Model evaluation measures how well an AI or machine learning
model performs on appropriate data using suitable metrics.
</p>

<div class="example">
<strong>Examples:</strong>
<pre>
Classification:
Accuracy
Precision
Recall
F1-score

Regression:
MAE
MSE
RMSE
R²
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
AI model evaluation uses appropriate metrics and unseen data
to measure model performance and generalization.
</div>

</div>


<div class="question">

<h3>49. What are the challenges of AI?</h3>

<p>
Common AI challenges include data quality, bias, privacy,
security, computational cost, interpretability and model
reliability.
</p>

<div class="example">
<strong>Examples:</strong>
<pre>
Poor Data
   ↓
Poor Model

Biased Data
   ↓
Biased Prediction
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
Important AI challenges include data quality, bias, privacy,
security, high computational requirements, explainability and
reliable evaluation.
</div>

</div>


<div class="question">

<h3>50. How would you explain AI in an interview?</h3>

<p>
Artificial Intelligence is a field of computer science that
enables machines to learn from data, understand information,
generate content, recognize patterns and make decisions.
It includes areas such as Machine Learning, Deep Learning,
NLP, Computer Vision and Generative AI.
</p>

<div class="example">
<strong>Example:</strong>
<pre>
Data
 ↓
Machine Learning
 ↓
AI Model
 ↓
Prediction / Decision

or

Prompt
 ↓
Generative AI
 ↓
Text / Image / Code
</pre>
</div>

<div class="interview">
<strong>Interview Answer:</strong>
AI is a branch of computer science that enables machines to
perform tasks that normally require human intelligence. I have
an understanding of Machine Learning, Deep Learning, NLP,
Generative AI, prompt engineering and AI model concepts.
AI can be integrated with Python and web applications to build
features such as chatbots, recommendation systems, prediction
systems and intelligent automation.
</div>

</div>
