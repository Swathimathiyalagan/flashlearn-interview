/* =========================================
   FLASHLEARN PRO - CURRENT TOPIC PDF
   ========================================= */

function downloadCurrentPDF() {

    if (typeof window.jspdf === "undefined") {

        alert("PDF library not loaded!");

        return;
    }


    const { jsPDF } = window.jspdf;

    const pdf = new jsPDF(
        "p",
        "mm",
        "a4"
    );


    const pageWidth =
        pdf.internal.pageSize.getWidth();

    const pageHeight =
        pdf.internal.pageSize.getHeight();


    const margin = 18;

    const contentWidth =
        pageWidth - (margin * 2);


    let y = 40;


    /* =================================
       GET CURRENT TITLE
       ================================= */

    const title =
        document.getElementById("title")
        .innerText;


    /* =================================
       HEADER
       ================================= */

    pdf.setFillColor(
        37,
        99,
        235
    );

    pdf.rect(
        0,
        0,
        pageWidth,
        28,
        "F"
    );


    pdf.setTextColor(
        255,
        255,
        255
    );


    pdf.setFont(
        "helvetica",
        "bold"
    );

    pdf.setFontSize(18);


    pdf.text(
        "FlashLearn Pro",
        margin,
        12
    );


    pdf.setFont(
        "helvetica",
        "normal"
    );

    pdf.setFontSize(10);


    pdf.text(
        title,
        margin,
        21
    );


    /* =================================
       GET QUESTIONS HTML
       ================================= */

    const questions =
        document.getElementById(
            "questions"
        );


    /*
       Get every question element
    */

    const items =
        questions.children;


    /* =================================
       LOOP QUESTIONS
       ================================= */

    for (
        let i = 0;
        i < items.length;
        i++
    ) {


        const item =
            items[i];


        const text =
            item.innerText.trim();


        if (!text) {

            continue;

        }


        /* =================================
           TEXT WRAPPING
           ================================= */

        pdf.setFont(
            "helvetica",
            "normal"
        );

        pdf.setFontSize(10);


        const lines =
            pdf.splitTextToSize(
                text,
                contentWidth
            );


        const lineHeight = 5;


        const textHeight =
            lines.length *
            lineHeight;


        const boxHeight =
            textHeight + 14;


        /* =================================
           PAGE BREAK
           ================================= */

        if (
            y + boxHeight >
            pageHeight - 25
        ) {


            addPageNumber(
                pdf
            );


            pdf.addPage();


            y = 20;


            /* HEADER */

            pdf.setFillColor(
                37,
                99,
                235
            );


            pdf.rect(
                0,
                0,
                pageWidth,
                18,
                "F"
            );


            pdf.setTextColor(
                255,
                255,
                255
            );


            pdf.setFont(
                "helvetica",
                "bold"
            );


            pdf.setFontSize(11);


            pdf.text(
                "FlashLearn Pro",
                margin,
                11
            );


            y = 28;

        }


        /* =================================
           QUESTION BOX
           ================================= */

        pdf.setFillColor(
            239,
            246,
            255
        );


        pdf.roundedRect(
            margin - 2,
            y - 5,
            contentWidth + 4,
            boxHeight,
            3,
            3,
            "F"
        );


        /* =================================
           QUESTION NUMBER
           ================================= */

        pdf.setTextColor(
            37,
            99,
            235
        );


        pdf.setFont(
            "helvetica",
            "bold"
        );


        pdf.setFontSize(10);


        pdf.text(
            "Question " + (i + 1),
            margin,
            y
        );


        y += 6;


        /* =================================
           QUESTION / ANSWER TEXT
           ================================= */

        pdf.setTextColor(
            30,
            41,
            59
        );


        pdf.setFont(
            "helvetica",
            "normal"
        );


        pdf.setFontSize(10);


        pdf.text(
            lines,
            margin,
            y
        );


        y += textHeight + 12;


        /* =================================
           SEPARATOR
           ================================= */

        pdf.setDrawColor(
            226,
            232,
            240
        );


        pdf.line(
            margin,
            y,
            pageWidth - margin,
            y
        );


        y += 8;

    }


    /* =================================
       PAGE NUMBER
       ================================= */

    addPageNumber(
        pdf
    );


    /* =================================
       FILE NAME
       ================================= */

    const fileName =
        title
        .replace(
            /[^a-zA-Z0-9]/g,
            "-"
        );


    pdf.save(
        "FlashLearn-" +
        fileName +
        ".pdf"
    );

}


/* =========================================
   PAGE NUMBER
   ========================================= */

function addPageNumber(pdf) {


    const pageCount =
        pdf.internal
        .getNumberOfPages();


    const pageHeight =
        pdf.internal
        .pageSize
        .getHeight();


    const pageWidth =
        pdf.internal
        .pageSize
        .getWidth();


    for (
        let i = 1;
        i <= pageCount;
        i++
    ) {


        pdf.setPage(i);


        pdf.setFont(
            "helvetica",
            "normal"
        );


        pdf.setFontSize(8);


        pdf.setTextColor(
            100,
            100,
            100
        );


        pdf.text(
            "FlashLearn Pro",
            18,
            pageHeight - 10
        );


        pdf.text(
            "Page " +
            i +
            " of " +
            pageCount,

            pageWidth - 18,

            pageHeight - 10,

            {
                align: "right"
            }
        );

    }

}
